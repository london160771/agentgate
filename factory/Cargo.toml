[package]
name = "agentgate-factory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AgentGate factory: creates one locked vault account per user, with the user as owner"
repository = "https://github.com/london160771/agentgate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
